name: GTVD Daily Pipeline
on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间 8:00
  workflow_dispatch:      # 允许手动触发

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd gtvd-backend && npm install
      - name: Update hotspots
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          BRIGHTDATA_PROXY_HOST: ${{ secrets.BRIGHTDATA_PROXY_HOST }}
          BRIGHTDATA_PROXY_PORT: ${{ secrets.BRIGHTDATA_PROXY_PORT }}
          BRIGHTDATA_PROXY_USERNAME: ${{ secrets.BRIGHTDATA_PROXY_USERNAME }}
          BRIGHTDATA_PROXY_PASSWORD: ${{ secrets.BRIGHTDATA_PROXY_PASSWORD }}
        run: cd gtvd-backend && npm run update
      - name: Save manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-manifest
          path: gtvd-frontend/public/latest.json
