name: GTVD Daily Pipeline
on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间 8:00
  workflow_dispatch:      # 允许手动触发

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: cd gtvd-backend && npm install
      - name: Run daily workflow
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          BRIGHTDATA_PROXY_HOST: ${{ secrets.BRIGHTDATA_PROXY_HOST }}
          BRIGHTDATA_PROXY_PORT: ${{ secrets.BRIGHTDATA_PROXY_PORT }}
          BRIGHTDATA_PROXY_USERNAME: ${{ secrets.BRIGHTDATA_PROXY_USERNAME }}
          BRIGHTDATA_PROXY_PASSWORD: ${{ secrets.BRIGHTDATA_PROXY_PASSWORD }}
        run: cd gtvd-backend && node scheduler.js --run
      - name: Commit and push generated video
        run: |
          git config user.name "GTVD Bot"
          git config user.email "bot@gtvd.local"
          cp gtvd-backend/output/latest.json gtvd-frontend/public/latest.json
          mkdir -p gtvd-frontend/public/videos
          cp gtvd-backend/output/videos/*.mp4 gtvd-frontend/public/videos/
          git add .
          git commit -m "每日自动更新视频日报" || echo "No changes"
          git push
