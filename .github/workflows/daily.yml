name: GTVD Daily Pipeline
on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间 8:00
  workflow_dispatch:      # 允许手动触发

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd gtvd-backend && npm install
      - name: Update hotspots
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          BRIGHTDATA_PROXY_HOST: ${{ secrets.BRIGHTDATA_PROXY_HOST }}
          BRIGHTDATA_PROXY_PORT: ${{ secrets.BRIGHTDATA_PROXY_PORT }}
          BRIGHTDATA_PROXY_USERNAME: ${{ secrets.BRIGHTDATA_PROXY_USERNAME }}
          BRIGHTDATA_PROXY_PASSWORD: ${{ secrets.BRIGHTDATA_PROXY_PASSWORD }}
        run: cd gtvd-backend && npm run update
      - name: Commit and push updates
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "GTVD Bot"
          git config user.email "bot@gtvd.local"
          git add .
          git commit -m "每日自动更新热点日报" || echo "No changes"
          git push https://x-access-token:$GH_TOKEN@github.com/zhoutao428/GTVD-project.git main
